name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Branch deploy (gh-pages) — avoids Actions→Pages artifact pipeline which has been
# stuck in deployment_queued / deployment_in_progress until the hard 10m timeout.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Skip ~350MB MP3s — catalog audio is loaded from CDN at runtime
          sparse-checkout: |
            .github
            public
            scripts
            src
            index.html
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.app.json
            tsconfig.node.json
            vite.config.ts
            eslint.config.js
            README.md
          sparse-checkout-cone-mode: true

      - name: Drop local music from Pages bundle
        run: rm -rf public/music

      - name: Resolve music CDN
        id: music_cdn
        run: |
          if [ -n "${{ vars.MUSIC_CDN_URL }}" ]; then
            echo "url=${{ vars.MUSIC_CDN_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.sha }}/public/music" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_MUSIC_CDN_URL: ${{ steps.music_cdn.outputs.url }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REDIRECT_URI: https://maggiecycy.github.io/dj-booth/callback

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
