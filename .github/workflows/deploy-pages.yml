name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ~350MB of MP3s cannot ship on Pages (backend deploy hard-timeout = 10 min).
      # Catalog audio is loaded from jsDelivr (or vars.MUSIC_CDN_URL) at runtime.
      - name: Drop local music from Pages bundle
        run: rm -rf public/music

      - name: Resolve music CDN
        id: music_cdn
        run: |
          if [ -n "${{ vars.MUSIC_CDN_URL }}" ]; then
            echo "url=${{ vars.MUSIC_CDN_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.sha }}/public/music" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_MUSIC_CDN_URL: ${{ steps.music_cdn.outputs.url }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REDIRECT_URI: https://maggiecycy.github.io/dj-booth/callback

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
